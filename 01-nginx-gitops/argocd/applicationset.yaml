apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nginx
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
            autoSync: "true"
          - env: staging
            autoSync: "true"
          - env: prod
            autoSync: "false"
  template:
    metadata:
      name: 'nginx-{{.env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/abhi0xdev/enterprise_project_demo
        targetRevision: main
        path: 01-nginx-gitops/charts/nginx-app
        helm:
          releaseName: 'nginx-{{.env}}'
          valueFiles:
            - values.yaml
            - 'values-{{.env}}.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'nginx-{{.env}}'
  templatePatch: |
    {{- if eq .autoSync "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
