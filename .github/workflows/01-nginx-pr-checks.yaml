name: 01-nginx-pr-checks

on:
  pull_request:
    paths:
      - "01-nginx-gitops/**"

jobs:
  helm-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Helm lint
        run: helm lint 01-nginx-gitops/charts/nginx-app -f 01-nginx-gitops/charts/nginx-app/values-dev.yaml

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate rendered manifests
        run: |
          helm template nginx 01-nginx-gitops/charts/nginx-app \
            -f 01-nginx-gitops/charts/nginx-app/values-dev.yaml \
            | kubeconform -strict -summary
